<!DOCTYPE html>
<html>
<head>
  <title>Delhi Iftar Live Countdown</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #0d1b2a;
      color: white;
      padding-top: 50px;
    }
    .box {
      background: #1b263b;
      padding: 25px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }
    h1 {
      color: #ffd60a;
    }
    #countdown {
      font-size: 28px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>🌙 Delhi Iftar Countdown</h1>
  <h2>Today's Iftar Time: 6:20 PM</h2>
  <div id="countdown"></div>
</div>

<script>
  let iftar = new Date();
  iftar.setHours(18);
  iftar.setMinutes(20);
  iftar.setSeconds(0);

  function updateCountdown() {
    let now = new Date();
    let diff = iftar - now;

    if (diff <= 0) {
      document.getElementById("countdown").innerHTML = "Iftar Time! 🌙";
      return;
    }

    let hours = Math.floor(diff / (1000 * 60 * 60));
    let minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
      hours + "h " + minutes + "m " + seconds + "s";
  }

  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
