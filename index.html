<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Ultra Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}

body{
background:linear-gradient(-45deg,#0b2e13,#14532d,#1b4332,#081c15);
background-size:400% 400%;
animation:bg 15s ease infinite;
color:white;
text-align:center;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{padding:20px}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
margin:15px 0;
box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

.live{
color:#00ff88;
font-weight:bold;
}

#clock{color:white}

.time{
font-size:48px;
font-weight:bold;
margin:10px 0;
}

.countdown{
color:#ffd166;
}

.progress{
height:12px;
background:rgba(255,255,255,0.2);
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#00ff88;
transition:1s;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
margin-top:15px;
}

.day{
padding:8px;
background:rgba(255,255,255,0.1);
border-radius:8px;
font-size:14px;
}

.today{
background:#00ff88;
color:black;
font-weight:bold;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#00ff88;
color:black;
margin-top:10px;
}

.footer{
margin:30px 0;
opacity:0.8;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌙 Ramadan Mubarak</h1>
<div id="location">Detecting location...</div>

<div class="live">LIVE <span id="clock"></span></div>

<div class="card">
<h2 id="mainTitle">Loading...</h2>
<div class="time" id="mainTime">--:--</div>
<div class="countdown" id="countdown"></div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>

<div class="card">
<h3>Ramadan Calendar</h3>
<div id="hijriInfo"></div>
<div class="calendar-grid" id="calendar"></div>
</div>

<div class="card">
<h3>Tasbeeh Counter</h3>
<div id="count" style="font-size:28px;margin:10px">0</div>
<button onclick="inc()">Click</button>
<button onclick="reset()">Reset</button>
</div>

<div class="footer">
Created with ❤️ for Ramadan
</div>

</div>

<audio id="beep" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="azan" src="https://www.islamcan.com/audio/adhan/azan1.mp3"></audio>

<script>
let lat,lon,prayerData,hijriDay,hijriMonth,hijriYear;

setInterval(()=>{
document.getElementById("clock").innerText=
new Date().toLocaleTimeString();
},1000);

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude;
lon=pos.coords.longitude;
loadData();
});

function loadData(){

fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
.then(res=>res.json())
.then(data=>{
document.getElementById("location").innerText=
(data.address.city||data.address.state)+", "+data.address.country;
});

fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=2`)
.then(res=>res.json())
.then(data=>{

prayerData=data.data.timings;

let hijri=data.data.date.hijri;
hijriDay=parseInt(hijri.day);
hijriMonth=hijri.month.en;
hijriYear=hijri.year;

document.getElementById("hijriInfo").innerText=
hijriDay+" "+hijriMonth+" "+hijriYear+" AH";

buildCalendar();
startMainLogic();
});
}

function buildCalendar(){
let grid="";
for(let i=1;i<=30;i++){
grid+=`<div class="day ${i==hijriDay?'today':''}">${i}</div>`;
}
document.getElementById("calendar").innerHTML=grid;
}

function startMainLogic(){

setInterval(()=>{

let now=new Date();
let [fh,fm]=prayerData.Fajr.split(":");
let [mh,mm]=prayerData.Maghrib.split(":");

let fajr=new Date();
let maghrib=new Date();

fajr.setHours(fh,fm,0);
maghrib.setHours(mh,mm,0);

let target,title,time;

if(now<fajr){
title="SEHRI (Fajr)";
time=prayerData.Fajr;
target=fajr;
}
else if(now<maghrib){
title="IFTAR (Maghrib)";
time=prayerData.Maghrib;
target=maghrib;
}
else{
title="SEHRI (Next Fajr)";
time=prayerData.Fajr;
target=new Date(fajr.getTime()+86400000);
}

document.getElementById("mainTitle").innerText=title;
document.getElementById("mainTime").innerText=time;

let diff=target-now;
let h=Math.floor(diff/1000/60/60);
let m=Math.floor(diff/1000/60)%60;
let s=Math.floor(diff/1000)%60;

document.getElementById("countdown").innerText=
"Countdown: "+h+"h "+m+"m "+s+"s";

let progress=(hijriDay/30)*100;
document.getElementById("progressBar").style.width=progress+"%";

if(h==0 && m==0 && s==0){
document.getElementById("azan").play();
}

},1000);
}

// Tasbeeh
let c=0;
function inc(){
c++;
document.getElementById("count").innerText=c;
document.getElementById("beep").play();
}
function reset(){
c=0;
document.getElementById("count").innerText=0;
}
</script>

</body>
</html>
