<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delhi Ramadan Live</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
background:linear-gradient(#0b1437, #020617);
}

/* 🌟 Stars */
.stars{
position:absolute;
width:100%;
height:100%;
background:transparent;
box-shadow:
50px 80px white,
150px 200px white,
300px 150px white,
500px 300px white,
700px 100px white,
900px 250px white,
1100px 400px white,
1300px 150px white,
1600px 350px white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.4;}
to{opacity:1;}
}

/* 🔴 LIVE */
.live-box{
position:absolute;
top:20px;
right:20px;
background:black;
padding:10px 20px;
border-radius:10px;
}

.live{
color:#ff0000;
font-size:28px;
font-weight:bold;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.5;}
100%{opacity:1;}
}

/* Container */
.container{
text-align:center;
z-index:2;
}

h1{
font-size:60px;
color:#ffd700;
margin-bottom:20px;
}

#eventTitle{
font-size:40px;
margin-bottom:20px;
}

#fixedTime{
font-size:35px;
color:#00ff66;
margin-bottom:20px;
font-weight:bold;
}

#countdown{
font-size:180px;
font-weight:900;
color:white;
text-shadow:0 0 20px white;
margin-bottom:20px;
transition:0.5s;
}

.warning{
animation:flash 0.8s infinite;
}

@keyframes flash{
0%{color:white;}
50%{color:#ff0000;}
100%{color:white;}
}

#food{
font-size:80px;
margin-bottom:20px;
}

.owner{
font-size:55px;
color:#ffd700;
font-weight:bold;
margin-top:20px;
}

/* Mobile */
@media(max-width:768px){
h1{font-size:35px;}
#eventTitle{font-size:25px;}
#fixedTime{font-size:20px;}
#countdown{font-size:80px;}
#food{font-size:45px;}
.owner{font-size:30px;}
.live{font-size:18px;}
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="live-box">
<span class="live">🔴 LIVE</span>
</div>

<div class="container">

<h1>🕌 Delhi Ramadan Live</h1>

<div id="eventTitle"></div>
<div id="fixedTime"></div>
<div id="countdown"></div>

<div id="food">🍎 🍉 🥤 🌴</div>

<div class="owner">Arshad Khan</div>

</div>

<script>

function updateTime(){

let now = new Date();

let sehri = new Date();
sehri.setHours(5,0,0,0);

let iftar = new Date();
iftar.setHours(18,20,0,0);

let target;
let title;
let fixed;

if(now < sehri){
target = sehri;
title = "🌅 Sehri Coming Soon";
fixed = "Fixed Time: 5:00 AM";
}
else if(now >= sehri && now < iftar){
target = iftar;
title = "🌙 Iftar Coming Soon";
fixed = "Fixed Time: 6:20 PM";
}
else{
sehri.setDate(sehri.getDate()+1);
target = sehri;
title = "🌅 Sehri Coming Soon";
fixed = "Fixed Time: 5:00 AM";
}

let diff = target - now;

let h = Math.floor(diff/(1000*60*60));
let m = Math.floor((diff%(1000*60*60))/(1000*60));
let s = Math.floor((diff%(1000*60))/1000);

let countdown = document.getElementById("countdown");

countdown.innerHTML = h+"h "+m+"m "+s+"s";

document.getElementById("eventTitle").innerHTML = title;
document.getElementById("fixedTime").innerHTML = fixed;

/* ⚠️ 1 मिनट बाकी */
if(diff <= 60000){
countdown.classList.add("warning");
}else{
countdown.classList.remove("warning");
}

}

updateTime();
setInterval(updateTime,1000);

</script>

</body>
</html>
