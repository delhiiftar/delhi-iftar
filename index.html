<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delhi Ramadan 2026</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f4efe6;
text-align:center;
color:#222;
overflow-x:hidden;
}

.hero{
position:relative;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url('https://images.unsplash.com/photo-1564769625392-651b8e50f1a3') center/cover;
height:260px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
}

h1{
font-size:34px;
margin:5px 0;
}

.live{
background:#00b894;
padding:8px 18px;
border-radius:25px;
font-weight:bold;
font-size:18px;
margin-top:8px;
}

.mubarak{
margin-top:10px;
font-size:18px;
color:#ffd369;
}

.main{
padding:30px 15px;
}

.iftar-time{
color:green;
font-size:24px;
font-weight:bold;
}

.countdown{
font-size:65px;
font-weight:bold;
margin:15px 0;
text-shadow:2px 2px 8px rgba(0,0,0,0.2);
}

.card{
background:white;
padding:15px 25px;
margin:10px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
font-size:20px;
display:inline-block;
}

.card span{
display:block;
font-size:24px;
font-weight:bold;
color:green;
}

.owner{
margin:30px 0;
font-size:26px;
font-weight:bold;
}

.eid{
display:none;
padding:40px 20px;
animation:fadeIn 2s ease-in-out forwards;
}

.eid h2{
font-size:40px;
color:#0d5c3f;
animation:glow 2s infinite alternate;
}

.eid p{
font-size:22px;
margin-top:10px;
}

@keyframes glow{
from{ text-shadow:0 0 10px gold; }
to{ text-shadow:0 0 25px orange; }
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.flower{
position:fixed;
top:-10px;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh);
}
}

.calendar{
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th, td{
padding:8px;
border:1px solid #ddd;
font-size:14px;
}

th{
background:#0d5c3f;
color:white;
}
</style>
</head>

<body>

<div class="hero">
<h1>🕌 Delhi Ramadan 2026</h1>
<div class="live">LIVE</div>
<div class="mubarak">Ramadan Mubarak from Arshad Khan 🌙</div>
</div>

<div class="main" id="ramadanContent">

<div class="iftar-time">Iftar Time: 18:17</div>
<div class="countdown" id="countdown"></div>

<div class="card">Sehri <span>05:34</span></div>
<div class="card">Iftar <span>18:17</span></div>

<div class="owner">Website by Arshad Khan</div>

</div>

<div class="eid" id="eidSection">
<h2>🌙 Eid Mubarak 🌙</h2>
<p>मेरी तरफ से आप सभी को दिल से मुबारकबाद</p>
<p><strong>– Arshad Khan</strong></p>
</div>

<div class="calendar">
<h2>Full Ramadan Calendar</h2>
<table>
<tr><th>Date</th><th>Sehri</th><th>Iftar</th></tr>
<tr><td>23 Feb</td><td>05:34</td><td>18:17</td></tr>
<tr><td>24 Feb</td><td>05:33</td><td>18:17</td></tr>
<tr><td>25 Feb</td><td>05:32</td><td>18:18</td></tr>
</table>
</div>

<script>
function updateCountdown(){
let now=new Date();
let target=new Date();
target.setHours(18);
target.setMinutes(17);
target.setSeconds(0);

let diff=target-now;

if(diff<0){
document.getElementById("countdown").innerText="Iftar Done";
return;
}

let h=Math.floor(diff/1000/60/60);
let m=Math.floor((diff/1000/60)%60);
let s=Math.floor((diff/1000)%60);

document.getElementById("countdown").innerText=
h+"h "+m+"m "+s+"s";
}

setInterval(updateCountdown,1000);
updateCountdown();

let today=new Date();
let eidDate=new Date("March 20, 2026");

if(today.toDateString()===eidDate.toDateString()){
document.getElementById("ramadanContent").style.display="none";
document.getElementById("eidSection").style.display="block";

for(let i=0;i<20;i++){
let flower=document.createElement("div");
flower.className="flower";
flower.style.left=Math.random()*100+"vw";
flower.style.animationDuration=(5+Math.random()*5)+"s";
flower.innerText="🌸";
document.body.appendChild(flower);
}
}
</script>

</body>
</html>
