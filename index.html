<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delhi Ramadan Live Premium</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
background:
linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)),
url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Jama_Masjid_Delhi.jpg/1920px-Jama_Masjid_Delhi.jpg');
background-size:cover;
background-position:center;
background-attachment:fixed;
overflow:hidden;
}

/* 🔴 LIVE Pulse Badge */
.live-badge{
position:absolute;
top:25px;
right:25px;
background:#ff0000;
color:white;
padding:14px 30px;
font-size:30px;
font-weight:bold;
border-radius:50px;
box-shadow:0 0 20px red;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{
transform:scale(1);
box-shadow:0 0 10px red, 0 0 20px red;
}
50%{
transform:scale(1.15);
box-shadow:0 0 30px red, 0 0 60px red;
}
100%{
transform:scale(1);
box-shadow:0 0 10px red, 0 0 20px red;
}
}

/* Moon */
.moon{
position:absolute;
top:5%;
left:-200px;
width:180px;
height:180px;
background:radial-gradient(circle at 30% 30%, #fff, #ddd);
border-radius:50%;
box-shadow:0 0 50px #fff, 0 0 120px #ffd60a;
animation:moveMoon 80s linear infinite;
}

@keyframes moveMoon{
from{left:-200px;}
to{left:120%;}
}

.container{
width:95%;
max-width:1200px;
text-align:center;
background:rgba(0,0,0,0.6);
padding:80px;
border-radius:50px;
backdrop-filter:blur(15px);
box-shadow:0 0 100px rgba(255,0,0,0.7);
}

h1{
font-size:70px;
color:#ffd60a;
margin-bottom:25px;
}

#eventTitle{
font-size:55px;
margin-bottom:20px;
}

#fixedTime{
font-size:42px;
color:#00ffcc;
margin-bottom:30px;
}

#countdown{
font-size:170px;
font-weight:bold;
margin-bottom:30px;
color:#ff0000;
text-shadow:0 0 25px red, 0 0 60px red;
}

#food{
font-size:100px;
margin-bottom:20px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

.owner{
margin-top:30px;
font-size:45px;
color:#ffd60a;
}

@media(max-width:768px){
h1{font-size:45px;}
#eventTitle{font-size:32px;}
#fixedTime{font-size:24px;}
#countdown{font-size:85px;}
#food{font-size:55px;}
.owner{font-size:30px;}
.live-badge{font-size:18px;padding:8px 15px;}
}
</style>
</head>

<body>

<div class="live-badge">🔴 LIVE</div>
<div class="moon"></div>

<div class="container">

<h1>🕌 Delhi Ramadan Live</h1>

<div id="eventTitle"></div>
<div id="fixedTime"></div>
<div id="countdown"></div>

<div id="food">🍎 🍉 🥤 🌴</div>

<div class="owner">Website by Arshad Khan</div>

</div>

<script>

function updateTime(){

let now = new Date();

let sehri = new Date();
sehri.setHours(5,0,0,0);

let iftar = new Date();
iftar.setHours(18,20,0,0);

let target;
let title;
let fixed;

if(now < sehri){
target = sehri;
title = "🌅 Sehri Coming Soon";
fixed = "Fixed Time: 5:00 AM";
}
else if(now >= sehri && now < iftar){
target = iftar;
title = "🌙 Iftar Coming Soon";
fixed = "Fixed Time: 6:20 PM";
}
else{
sehri.setDate(sehri.getDate()+1);
target = sehri;
title = "🌅 Sehri Coming Soon";
fixed = "Fixed Time: 5:00 AM";
}

let diff = target - now;

let h = Math.floor(diff/(1000*60*60));
let m = Math.floor((diff%(1000*60*60))/(1000*60));
let s = Math.floor((diff%(1000*60))/1000);

document.getElementById("eventTitle").innerHTML = title;
document.getElementById("fixedTime").innerHTML = fixed;
document.getElementById("countdown").innerHTML =
h+"h "+m+"m "+s+"s";

}

updateTime();
setInterval(updateTime,1000);

</script>

</body>
</html>
