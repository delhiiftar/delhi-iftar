<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ramadan Live - Arshad Khan</title>

<style>

body{
margin:0;
font-family:Arial;
background:#062f1f;
color:white;
text-align:center;
}

.container{
max-width:480px;
margin:auto;
padding:16px;
}

.live{
background:red;
padding:6px 14px;
border-radius:20px;
font-weight:bold;
animation:blink 1s infinite;
}

@keyframes blink{50%{opacity:0.3}}

.card{
background:#0b3d2e;
padding:18px;
border-radius:12px;
margin-top:14px;
}

.big{font-size:28px;font-weight:bold}

.location{color:#9fffdc;font-size:14px}

.prayer{
display:flex;
justify-content:space-between;
padding:10px;
border-radius:6px;
margin:6px 0;
font-weight:bold;
}

.active{
box-shadow:0 0 12px #00ffae;
}

.fajr{background:#4c6ef5}
.dhuhr{background:#f08c00}
.asr{background:#845ef7}
.maghrib{background:#e03131}
.isha{background:#2f9e44}

.calendar-days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px;
margin-bottom:6px;
}

.calendar-days div{
background:#0f5132;
padding:6px;
border-radius:6px;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}

.day{
background:#0f5132;
padding:10px;
border-radius:8px;
}

.today{
background:#00ffae;
color:black;
font-weight:bold;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
margin:5px;
background:#00a97f;
color:white;
}

input,textarea{
width:90%;
padding:10px;
margin:6px;
border-radius:8px;
border:none;
}

#compass{font-size:50px}

footer{
margin-top:20px;
font-size:13px;
color:#9fffdc;
}

</style>
</head>

<body>

<div class="container">

<h2>🌙 Ramadan Live</h2>
<div class="live">LIVE</div>

<div id="clock"></div>
<div id="date"></div>
<div id="hijri"></div>
<div id="ramadanDay"></div>

<div class="location" id="location">Detecting location...</div>

<div class="card">
<h3>Iftar Countdown</h3>
<div class="big" id="countdown">Loading...</div>
</div>

<div id="sehriIftar"></div>

<div class="card">
<h3>🕌 5 Waqt Namaz</h3>

<div id="p1" class="prayer fajr"><span>Fajr</span><span id="fajr"></span></div>
<div id="p2" class="prayer dhuhr"><span>Dhuhr</span><span id="dhuhr"></span></div>
<div id="p3" class="prayer asr"><span>Asr</span><span id="asr"></span></div>
<div id="p4" class="prayer maghrib"><span>Maghrib</span><span id="maghrib"></span></div>
<div id="p5" class="prayer isha"><span>Isha</span><span id="isha"></span></div>

</div>

<div class="card">

<h3>📅 Calendar</h3>

<div class="calendar-days">
<div>Sun</div><div>Mon</div><div>Tue</div>
<div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div id="calendar" class="calendar-grid"></div>

</div>

<div class="card">

<h3>📿 Tasbih Counter</h3>
<div class="big" id="count">0</div>

<button onclick="tap()">Tap</button>
<button onclick="reset()">Reset</button>

</div>

<div class="card">
<h3>🧭 Qibla Compass</h3>
<div id="compass">🧭</div>
</div>

<div class="card">

<h3>Feedback</h3>

<form action="mailto:example@email.com">

<input placeholder="Name">
<textarea placeholder="Message"></textarea>

<br>

<button type="submit">Send</button>

</form>

</div>

<footer>
Developed & Owned by <b>Arshad Khan</b>
</footer>

</div>

<script>

function updateClock(){
const now=new Date()
document.getElementById("clock").innerHTML=now.toLocaleTimeString()
document.getElementById("date").innerHTML=now.toDateString()
}
setInterval(updateClock,1000)

function to12(t){
let p=t.split(":")
let h=parseInt(p[0])
let m=p[1]
let a=h>=12?"PM":"AM"
h=h%12
h=h?h:12
return h+":"+m+" "+a
}

function calendar(){
let now=new Date()
let y=now.getFullYear()
let m=now.getMonth()

let first=new Date(y,m,1).getDay()
let days=new Date(y,m+1,0).getDate()

let cal=document.getElementById("calendar")

for(let i=0;i<first;i++) cal.innerHTML+="<div></div>"

for(let d=1;d<=days;d++){
let cls="day"
if(d===now.getDate()) cls+=" today"
cal.innerHTML+=`<div class="${cls}">${d}</div>`
}
}
calendar()

let c=0
function tap(){c++;document.getElementById("count").innerText=c;navigator.vibrate(30)}
function reset(){c=0;document.getElementById("count").innerText=c}

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude

fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=2`)
.then(r=>r.json())
.then(d=>{

let t=d.data.timings
let date=d.data.date

document.getElementById("hijri").innerText="🕌 "+date.hijri.day+" "+date.hijri.month.en+" "+date.hijri.year+" AH"

document.getElementById("ramadanDay").innerText="🌙 Ramadan Day "+date.hijri.day

document.getElementById("fajr").innerText=to12(t.Fajr)
document.getElementById("dhuhr").innerText=to12(t.Dhuhr)
document.getElementById("asr").innerText=to12(t.Asr)
document.getElementById("maghrib").innerText=to12(t.Maghrib)
document.getElementById("isha").innerText=to12(t.Isha)

let mag=t.Maghrib
let p=mag.split(":")
let target=new Date()
target.setHours(p[0])
target.setMinutes(p[1])

function countdown(){
let now=new Date()
let diff=target-now

let h=Math.floor(diff/3600000)
let m=Math.floor(diff%3600000/60000)
let s=Math.floor(diff%60000/1000)

document.getElementById("countdown").innerText=h+"h "+m+"m "+s+"s"
}

setInterval(countdown,1000)

})

fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
.then(r=>r.json())
.then(d=>{
document.getElementById("location").innerText="📍 "+d.address.city+", "+d.address.country
})

})

window.addEventListener("deviceorientation",e=>{
document.getElementById("compass").style.transform="rotate("+e.alpha+"deg)"
})

</script>

</body>
</html>
