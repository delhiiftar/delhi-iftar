<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramadan Ultimate Live</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f1e6;
text-align:center;
transition:0.5s;
}

.day{
background:#f5f1e6;
color:#1b4332;
}

.night{
background:#0b2e13;
color:white;
}

.hero{
padding:20px;
position:relative;
}

.trees-left, .trees-right{
position:absolute;
top:20px;
display:flex;
flex-direction:column;
font-size:30px;
opacity:0.7;
}

.trees-left{ left:10px; }
.trees-right{ right:10px; }

.live{
color:#00ff88;
font-weight:bold;
font-size:22px;
animation:blink 2.5s infinite;
}

@keyframes blink{
0%{opacity:1}
50%{opacity:0.5}
100%{opacity:1}
}

#clock{ color:white; }

.mainbox{
margin:20px;
padding:25px;
border-radius:20px;
background:#14532d;
color:white;
}

.time{
font-size:50px;
font-weight:bold;
}

.countdown{
color:#ffd166;
margin-top:10px;
}

.scroll{
color:#d00000;
font-weight:bold;
margin-top:15px;
}

.prayer, .calendar{
background:white;
margin:20px;
padding:15px;
border-radius:15px;
color:black;
}

.row{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid #ddd;
}

.dua{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
font-size:22px;
}

.tasbeeh{
margin:20px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#0f5132;
color:white;
margin:5px;
}

.footer-name{
margin:40px 0;
font-size:22px;
opacity:0.8;
}
</style>
</head>

<body class="day">

<div class="hero">

<div class="trees-left">
🌴
🌴
🌴
</div>

<div class="trees-right">
🌴
🌴
🌴
</div>

<h1>🌙 Ramadan Mubarak</h1>
<div id="location">Detecting location...</div>

<div class="live">
LIVE <span id="clock"></span>
</div>

<div id="hijri"></div>

<input type="text" id="manualCity" placeholder="Enter City Name">
<button onclick="searchCity()">Search</button>

</div>

<div class="mainbox">
<h2 id="mainTitle">Loading...</h2>
<div class="time" id="mainTime">--:--</div>
<div class="countdown" id="countdown"></div>
</div>

<div class="scroll">⬇ Scroll for More ⬇</div>

<div class="prayer" id="prayerTimes"></div>

<div class="calendar" id="calendar"></div>

<div class="dua">
<b>Sehri Dua:</b><br>
وَبِصَوْمِ غَدٍ نَّوَيْتُ مِنْ شَهْرِ رَمَضَانَ
<br><br>
<b>Iftar Dua:</b><br>
اللَّهُمَّ إِنِّي لَكَ صُمْتُ وَبِكَ آمَنْتُ
</div>

<div class="tasbeeh">
<h3>Tasbeeh Counter</h3>
<div id="count">0</div>
<button onclick="increment()">Click</button>
<button onclick="reset()">Reset</button>
</div>

<div class="footer-name">
Created with ❤️ for Ramadan
</div>

<audio id="beep" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="azan" src="https://www.islamcan.com/audio/adhan/azan1.mp3"></audio>

<script>

let lat,lon,prayerData;

setInterval(()=>{
document.getElementById("clock").innerText=
new Date().toLocaleTimeString();
},1000);

// Day Night Auto Theme
function updateTheme(){
let hour=new Date().getHours();
if(hour>=18 || hour<=5){
document.body.className="night";
}else{
document.body.className="day";
}
}
setInterval(updateTheme,60000);
updateTheme();

// Tasbeeh
let c=0;
function increment(){
c++;
document.getElementById("count").innerText=c;
document.getElementById("beep").play();
}
function reset(){
c=0;
document.getElementById("count").innerText=0;
}

// Location Auto
navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude;
lon=pos.coords.longitude;
loadPrayer(lat,lon);
});

// Manual Search
function searchCity(){
let city=document.getElementById("manualCity").value;
fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${city}`)
.then(res=>res.json())
.then(data=>{
lat=data[0].lat;
lon=data[0].lon;
loadPrayer(lat,lon);
});
}

function loadPrayer(lat,lon){

fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
.then(res=>res.json())
.then(data=>{
document.getElementById("location").innerText=
(data.address.city||data.address.state)+", "+data.address.country;
});

fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=2`)
.then(res=>res.json())
.then(data=>{

prayerData=data.data.timings;

let hijri=data.data.date.hijri;
document.getElementById("hijri").innerText=
hijri.day+" Ramadan "+hijri.year+" AH";

let prayers=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
let html="";
prayers.forEach(p=>{
html+=`<div class="row"><span>${p}</span><span>${prayerData[p]}</span></div>`;
});
document.getElementById("prayerTimes").innerHTML=html;

document.getElementById("calendar").innerHTML=
"Hijri Month: "+hijri.month.en+" "+hijri.year;

startMainLogic();

});
}

function startMainLogic(){

setInterval(()=>{

let now=new Date();

let [fh,fm]=prayerData.Fajr.split(":");
let [mh,mm]=prayerData.Maghrib.split(":");

let fajr=new Date();
let maghrib=new Date();

fajr.setHours(fh,fm,0);
maghrib.setHours(mh,mm,0);

let target,title,time;

if(now<fajr){
title="SEHRI (Fajr)";
time=prayerData.Fajr;
target=fajr;
}
else if(now<maghrib){
title="IFTAR (Maghrib)";
time=prayerData.Maghrib;
target=maghrib;
}
else{
title="SEHRI (Next Fajr)";
time=prayerData.Fajr;
target=new Date(fajr.getTime()+86400000);
}

document.getElementById("mainTitle").innerText=title;
document.getElementById("mainTime").innerText=time;

let diff=target-now;
let h=Math.floor(diff/1000/60/60);
let m=Math.floor(diff/1000/60)%60;
let s=Math.floor(diff/1000)%60;

document.getElementById("countdown").innerText=
"Countdown: "+h+"h "+m+"m "+s+"s";

if(h==0 && m==0 && s==0){
document.getElementById("azan").play();
}

},1000);

}

</script>

</body>
</html>
